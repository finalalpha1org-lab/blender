# Final Effect 3D branding configuration
# Consumed by tools/rebrand/apply_branding.py. Edit this file, not upstream code.

PRODUCT_NAME = Final Effect 3D
PRODUCT_SLUG = final-effect-3d
COMPANY = Final Alpha
APP_ID = com.finalalpha.finaleffect3d

# --- replacement switches (read tools/rebrand/README.md before enabling) ---
# Replace the standalone word Blender with the product name in allow-listed files.
REPLACE_WORD_BLENDER = 1
# Replace blender.org URLs. Off by default: upstream docs links stay useful.
REPLACE_URLS = 0
URL_REPLACEMENT = finalalpha1org-lab.github.io/Final-Effect-3D
# Replace lowercase blender identifiers (paths, targets, config dirs). NEVER enable
# this without reading docs/PLAN.md ADR-3 and ADR-5; it breaks the ecosystem.
REPLACE_LOWER_BLENDER = 0
# Replace Blender Foundation mentions. Off by default: most are attribution.
REPLACE_BLENDER_FOUNDATION = 0
# Rewrite localisation catalogs (49 .po files, about 82 MB). Opt in deliberately.
REPLACE_LOCALE = 0

# --- structural renames (opt in when you are ready to follow the references) ---
RENAME_DESKTOP_ENTRY = 0
RENAME_APPSTREAM_ID = 0
RENAME_MACOS_BUNDLE = 0

# --- release identity ---
# Keep upstream version numbers, append our own suffix (docs/REBRANDING.md section 6).
VERSION_SUFFIX = -fe3d
# Keep Blender user data paths in phase 1 (docs/PLAN.md ADR-5).
KEEP_USER_PATHS = 1